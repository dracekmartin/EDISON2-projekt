# Strom modulu: kdyz se pohnou legacy zdroje, otevri PR s uz zregenerovanym Tree.cls.
#
# Proc PR a ne jen upozorneni: udrzba se tim zmeni na "reviewnout a mergnout" misto
# "vzpomen si, ze mas pustit skript". Lokalni .claude/hooks/tree-drift.sh zustava jako
# rychly signal, autoritou je tenhle workflow - porovnava proti default branchi
# mlinecz/EDISON, tedy proti spolecne pravde, ne proti lokalni kopii legacy repa.
#
# Runner: ubuntu staci. Generator ma cesty pres promenne prostredi a neni na Windows
# vazany; EDISON_DEPLOY_ROOT smeruje na neexistujici cestu zamerne - viz krok Regenerovat.

name: tree sync

on:
  repository_dispatch:
    types: [legacy-tree-changed]
  schedule:
    - cron: "0 4 * * 1-5"   # zaloha, kdyby dispatch nedorazil
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: bot/tree-sync
  TREE: EDISONMAIN2/CACHE/ALVA/EDISONMAIN2/API/Tree.cls

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EDISON2
        uses: actions/checkout@v5

      - name: Checkout legacy zdroju (jen tri soubory)
        uses: actions/checkout@v5
        with:
          repository: mlinecz/EDISON
          # ref zamerne NEuvedeno: legacy repo ma default branch "master", ne "main".
          # Nechame rozhodnout default branch, at to neprestane fungovat pri prejmenovani.
          token: ${{ secrets.LEGACY_REPO_TOKEN }}
          path: legacy
          # Legacy .git ma ~335 MB, proto sparse + depth 1.
          sparse-checkout: |
            EDCORE/Resources/edisonnavbar.xml
            EDCORE/Resources/edisontree.xml
            EDCORE/EDFormInterfaceLic.vb
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Regenerovat Tree.cls z legacy zdroju
        id: gen
        env:
          EDISON_LEGACY_ROOT: legacy
          EDISON2_ROOT: .
          # C:\Edison na runneru neexistuje a nema byt. ResolveExe pak vraci "" a launch
          # info se bere z override mapy v soucasnem Tree.cls - overeno, ze to dava
          # bit-identicky vystup jako beh na dev stroji. Vyjimka: NOVY uzel, ktery
          # v override mape jeste neni, by exe nedostal - proto se nize hlida pocet stubu.
          EDISON_DEPLOY_ROOT: /nonexistent-on-ci
        run: |
          set -euo pipefail
          # Generator vraci nenulovy kod, kdyz nezapsal (napr. smazany splice anchor).
          dotnet run --project tools/GenerateTree 2> gen-report.txt
          echo "--- report generatoru ---"
          cat gen-report.txt
          # Vzor zachytava jen ASCII cast - generator pise "oranzovych stubu" s diakritikou.
          stubs=$(sed -n 's/.*(bez exe): \([0-9]*\).*/\1/p' gen-report.txt | tail -1)
          echo "stubs=${stubs:-0}" >> "$GITHUB_OUTPUT"

      - name: Je co commitnout?
        id: diff
        run: |
          if git diff --quiet -- "$TREE" tools/tree-sources.sha256; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot je srovnany, nic k otevirani."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$TREE" tools/tree-sources.sha256
          fi

      - name: Zavrit uz nepotrebny PR
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Bez tohohle by po srovnani snapshotu zustal viset PR s nepravdivym diffem -
          # krok nize se pri changed=false vubec nespusti, takze by ho nikdo nezavrel.
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr close "$n" --delete-branch \
              --comment "Snapshot je uz srovnany se legacy zdroji, PR neni potreba."
            echo "PR #$n zavren."
          else
            echo "Zadny otevreny PR bota."
          fi

      - name: Otevrit / aktualizovat PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUBS: ${{ steps.gen.outputs.stubs }}
        run: |
          set -euo pipefail
          # Stara verze se musi vytahnout PRED commitem, jinak by HEAD ukazoval na novou.
          git show "HEAD:$TREE" > old-tree.cls
          python3 tools/tree-diff-summary.py old-tree.cls "$TREE" > summary.md

          git config user.name  "tree-sync bot"
          git config user.email "noreply@github.com"
          git checkout -B "$BRANCH"
          git add "$TREE" tools/tree-sources.sha256
          git -c commit.gpgsign=false commit -m "EDISON2 - regenerate module tree from legacy XML"
          git push --force origin "$BRANCH"

          {
            cat summary.md
            echo
            if [ "${STUBS:-0}" != "0" ]; then
              echo "> [!WARNING]"
              echo "> ${STUBS} modulu bez exe cesty - nemergovat, pust"
              echo "> \`tools/sync-tree.ps1\` na dev stroji."
              echo
            fi
            echo "Po mergnuti nasadit na Cache: \`powershell -File tools/sync-tree.ps1\`"
          } > pr-body.md

          open=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            gh pr edit "$n" --body-file pr-body.md
            echo "PR #$n aktualizovan."
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Strom modulu: regenerace z legacy XML" \
              --body-file pr-body.md
          fi
